@props(['title' => 'Home', 'description' => ''])
<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ $title }} · Stone</title>
    <meta name="description" content="{{ $description }}">

    <link rel="icon" href="/favicon.png" type="image/png">

    <!-- Fraunces carries the headlines (and the menu note's italic), Hanken Grotesk the body, DM Mono the small numbered labels. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..640;1,9..144,400..640&family=Hanken+Grotesk:wght@400..700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Loads Tailwind and inlines resources/css/site.css (theme tokens + motion system) -->
    @vite('resources/css/site.css')

    <!--
        Two flags before first paint: .js so scroll reveals never flash, and
        .dark when you chose the dark theme (or your device prefers it), so
        the page never blinks white on load. The moon/sun buttons in the top
        bar flip and remember the choice (see main.js).
    -->
    <script>
        document.documentElement.classList.add('js');
        try {
            var theme = localStorage.getItem('theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        } catch (error) {}
    </script>
    <script src="/js/main.js" defer></script>
</head>
<body class="min-h-dvh bg-canvas font-sans text-ink antialiased">

    <!-- The site-wide nav. Edit it once in components/nav.blade.html, it updates everywhere. -->
    <x-nav/>

    <!-- The fixed header floats over this; each page's opening section carries its own top padding. -->
    <main class="relative">
        {{ $slot }}
    </main>

    <x-footer/>

</body>
</html>
